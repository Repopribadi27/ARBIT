[package]
name = "mev-arb-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mev-arb-bot"
path = "src/main.rs"

[dependencies]
# ── Async Runtime ─────────────────────────────────────────────────────────────
tokio       = { version = "1", features = ["full"] }
futures-util = "0.3"

# ── Blockchain (Alloy 0.9) ────────────────────────────────────────────────────
alloy = { version = "0.9", features = [
    "full",
    "providers",
    "provider-ws",
    "transports-ws",
    "pubsub",
    "signers",
    "signer-local",
    "sol-types",
    "contract",
    "rpc-types",
    "network",
] }

# ── Serde (pinned agar cocok dengan alloy 0.9) ────────────────────────────────
serde        = { version = "=1.0.210", features = ["derive"] }
serde_derive = "=1.0.210"
serde_json   = "=1.0.128"

# ── Telegram Notification ─────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json"] }

# ── Data structures ───────────────────────────────────────────────────────────
dashmap = "6"

# ── Error handling ────────────────────────────────────────────────────────────
anyhow  = "1"

# ── Logging ───────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Utilities ─────────────────────────────────────────────────────────────────
dotenvy = "0.15"
chrono  = { version = "0.4", features = ["serde"] }
uuid    = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
