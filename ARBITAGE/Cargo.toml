[package]
name = "mev-arb-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# 1. Core Async & Utilities
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
dotenvy = "0.15"

# 2. Blockchain Interaction (Alloy)
alloy = { version = "0.9.2", features = ["full", "transport-ws", "rpc"] }

# 3. Logika Graph (Otak Arbitrase)
petgraph = "0.6"

# 4. Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 5. Time & Unique IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }

# ==========================================
# Gembok Serde & Serde_json ke Zaman Purba (Sebelum ada serde_core)
# Indexmap kita biarkan bebas agar Alloy tidak ngambek.
# ==========================================
serde = { version = "=1.0.210", features = ["derive"] }
serde_derive = "=1.0.210"
serde_json = "=1.0.128"
dashmap = "6.1.0"
futures-util = "0.3.32"
